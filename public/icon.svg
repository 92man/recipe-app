<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
    <linearGradient id="pan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A"/>
      <stop offset="100%" style="stop-color:#2D2D2D"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 프라이팬 몸체 -->
  <ellipse cx="256" cy="280" rx="140" ry="45" fill="url(#pan)"/>
  <ellipse cx="256" cy="270" rx="140" ry="45" fill="#3D3D3D"/>
  <ellipse cx="256" cy="265" rx="120" ry="35" fill="#2D2D2D"/>

  <!-- 프라이팬 손잡이 -->
  <rect x="370" y="255" width="90" height="30" rx="8" fill="#5C4033"/>
  <rect x="370" y="260" width="90" height="10" rx="4" fill="#7D5A44"/>

  <!-- 달걀 프라이 -->
  <ellipse cx="240" cy="250" rx="70" ry="50" fill="#FFFFFF"/>
  <ellipse cx="245" cy="245" rx="28" ry="25" fill="#FFD93D"/>
  <ellipse cx="250" cy="240" rx="8" ry="6" fill="#FFEB8A" opacity="0.6"/>

  <!-- 반짝임 효과 -->
  <circle cx="180" cy="200" r="8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="200" cy="185" r="4" fill="#FFFFFF" opacity="0.6"/>

  <!-- 김/연기 -->
  <path d="M200 170 Q210 150 200 130 Q190 110 200 90" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M240 160 Q250 140 240 120 Q230 100 240 80" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M280 170 Q290 150 280 130 Q270 110 280 90" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
