<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
    <linearGradient id="pan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A"/>
      <stop offset="100%" style="stop-color:#2D2D2D"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 프라이팬 몸체 (더 크게) -->
  <ellipse cx="230" cy="300" rx="180" ry="60" fill="url(#pan)"/>
  <ellipse cx="230" cy="288" rx="180" ry="60" fill="#3D3D3D"/>
  <ellipse cx="230" cy="280" rx="155" ry="48" fill="#2D2D2D"/>

  <!-- 프라이팬 손잡이 (더 크게) -->
  <rect x="385" y="265" width="110" height="38" rx="10" fill="#5C4033"/>
  <rect x="385" y="272" width="110" height="14" rx="5" fill="#7D5A44"/>

  <!-- 달걀 프라이 (더 크게) -->
  <ellipse cx="215" cy="260" rx="100" ry="70" fill="#FFFFFF"/>
  <ellipse cx="225" cy="250" rx="42" ry="38" fill="#FFD93D"/>
  <ellipse cx="235" cy="240" rx="12" ry="10" fill="#FFEB8A" opacity="0.6"/>

  <!-- 반짝임 효과 -->
  <circle cx="140" cy="200" r="10" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="165" cy="180" r="5" fill="#FFFFFF" opacity="0.6"/>

  <!-- 김/연기 (더 크게) -->
  <path d="M160 150 Q175 120 160 90 Q145 60 160 35" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M220 135 Q235 105 220 75 Q205 45 220 20" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M280 150 Q295 120 280 90 Q265 60 280 35" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
